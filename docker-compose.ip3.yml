services:
  api-probe:
    build:
      context: .
      dockerfile: Dockerfile.ip3
    ports:
      - "127.0.0.1:58080:8080"
    environment:
      IP3_PLANNER_DELAY_MS: "150"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
